version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: aegis-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data

  fastapi-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: aegis-fastapi-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - fastapi_logs:/app/logs
    depends_on:
      - chromadb

  nextjs-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AEGIS_SERVICE_URL=http://fastapi-service:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - fastapi-service

volumes:
  chromadb_data:
  fastapi_logs:
